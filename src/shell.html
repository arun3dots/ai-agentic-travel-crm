<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB">
<meta name="mobile-web-app-capable" content="yes">
<title>3dots Travel — the holiday desk</title>
<style>
  :root{
    /* 3dots type — the same stacks the 3dots site uses, so nothing has to be downloaded */
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    --font-mono: "SF Mono", Menlo, Consolas, monospace;

    --brand:#258C7B; --brand-dark:#1B6C5F; --brand-light:#34B39E; --brand-surface:#EBF7F5;
    --cream:#F4F6FB; --ink:#0F172A; --grey:#64748B; --hairline:#E2E8F0;
    --topbar-h:52px;
    --ease:160ms ease-out;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1100px 620px at 22% -10%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
      radial-gradient(900px 700px at 108% 112%, #EAF4F2 0%, rgba(234,244,242,0) 60%),
      var(--cream);
    color:var(--ink); font:13px/1.5 var(--font-sans);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    overflow:hidden; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, rgba(255,255,255,0) 52%, rgba(226,232,240,.42) 100%);}
  #hud{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:22}
  #hud>*{pointer-events:auto}

  /* the dotted wires: one per service, running from its chip down to every pod that service feeds */
  #svcLinks{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:visible}
  #svcLinks path{fill:none;stroke-linecap:round;stroke-dasharray:1.6 7;stroke-width:1.7;opacity:.45;
    transition:opacity var(--ease), stroke-width var(--ease);animation:svcFlow 1.05s linear infinite}
  #svcLinks path.hot{opacity:.95;stroke-width:2.6;stroke-dasharray:2.4 5}
  #svcLinks path.off{opacity:.15;stroke-dasharray:1.4 9;animation-duration:2.4s}
  @keyframes svcFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-8.6}}
  @media (prefers-reduced-motion: reduce){#svcLinks path{animation:none}}

  /* ---------- the top bar ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;gap:10px;
    padding:0 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);z-index:30;
  }
  .brand-wrap{display:flex;align-items:center;gap:9px;cursor:pointer;flex:0 0 auto}
  .terminal-dots{display:flex;gap:4px}
  .tdot{width:8px;height:8px;border-radius:50%}
  .tdot.red{background:#F4A69C}.tdot.amber{background:#F6D08A}.tdot.green{background:#8AD8C2}
  .brand{display:flex;align-items:center;gap:8px}
  .brand-logo{height:22px;display:block}
  #topconn{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;padding:2px 0}
  #topconn::-webkit-scrollbar{display:none}
  .svc{
    position:relative;display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;padding:2px;
    flex:0 0 29px;border:0;border-radius:9px;background:transparent;color:var(--grey);cursor:pointer;
    transition:background var(--ease),box-shadow var(--ease),transform var(--ease);
  }
  .svc::before{content:'';position:absolute;right:0;top:0;width:7px;height:7px;border:1.5px solid #fff;border-radius:50%;background:#CBD5E1;z-index:1}
  .svc-icon{
    display:block;width:25px;height:25px;padding:4px;border:1px solid rgba(15,23,42,.07);border-radius:7px;
    background:#fff;object-fit:contain;box-shadow:0 1px 2px rgba(15,23,42,.16);
    transition:transform var(--ease),box-shadow var(--ease),opacity var(--ease);
  }
  .svc.on::before{background:#22C55E}
  .svc.off::before{background:#F59E0B}
  .svc.off .svc-icon{opacity:.32;filter:grayscale(1)}
  .svc:hover{background:rgba(226,232,240,.7);transform:translateY(-1px)}
  .svc:hover .svc-icon{box-shadow:0 3px 7px rgba(15,23,42,.2)}
  .svc.hot{background:#E6F4F1;box-shadow:0 0 0 1px #BFE3DA,0 3px 9px rgba(37,140,123,.16)}
  .svc:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .svc-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .sp{flex:1}
  #topAppr{
    display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:20px;cursor:pointer;flex:0 0 auto;
    background:#FEF3C7;border:1px solid #FDE68A;color:#B45309;font:700 11px/1 var(--font-sans);letter-spacing:.04em;
  }
  #topAppr:hover{filter:brightness(.98)}
  #topFollow{
    display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:20px;cursor:pointer;flex:0 0 auto;
    background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3;font:700 11px/1 var(--font-sans);letter-spacing:.04em;
  }
  #topFollow:hover{filter:brightness(.98)}
  #topBook{
    display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:20px;cursor:pointer;flex:0 0 auto;
    background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;font:700 11px/1 var(--font-sans);letter-spacing:.04em;
  }
  #topBook:hover{filter:brightness(.98)}
  #clock{font:600 12px var(--font-mono);color:var(--grey);min-width:74px;text-align:right;flex:0 0 auto}

  /* ---------- agent name pills ---------- */
  .pill{
    position:absolute;top:0;left:0;white-space:nowrap;padding:2px 8px;border-radius:20px;
    background:rgba(255,255,255,.94);border:1px solid var(--hairline);box-shadow:0 1px 3px rgba(15,23,42,.09);
    font:600 9.5px/1.5 var(--font-sans);letter-spacing:.07em;color:#334155;cursor:pointer;
    transition:opacity var(--ease), background var(--ease), color var(--ease);transform-origin:50% 100%;
  }
  .pill:hover{background:var(--brand-surface);color:var(--brand-dark);border-color:#CDE9E2}
  .pill .star{color:#E5C158;margin-right:3px}

  /* ---------- pod cards ---------- */
  .badge{
    position:absolute;top:0;left:0;width:212px;padding:11px 12px 10px;border-radius:13px;cursor:pointer;
    background:rgba(255,255,255,.95);border:1px solid var(--hairline);
    box-shadow:0 10px 26px rgba(15,23,42,.10);backdrop-filter:blur(6px);
    transition:box-shadow var(--ease), border-color var(--ease);
  }
  .badge.glow{border-color:#BFE3DA;box-shadow:0 14px 34px rgba(37,140,123,.20)}
  .b-name{display:flex;align-items:center;gap:6px;font:700 10px var(--font-sans);letter-spacing:.12em;color:#334155}
  .b-name .dot{width:7px;height:7px;border-radius:50%}
  .b-name .live{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
  .b-count{display:flex;align-items:baseline;gap:5px;margin:6px 0 8px}
  .b-num{font:800 21px/1 var(--font-sans);color:var(--ink);letter-spacing:-.02em}
  .b-lab{font:700 9px var(--font-sans);letter-spacing:.14em;color:#94A3B8}
  .b-metrics{border-top:1px solid #F1F5F9;padding-top:7px;display:grid;gap:4px}
  .m-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .m-lab{font:600 8.5px var(--font-sans);letter-spacing:.1em;color:#94A3B8}
  .m-val{font:700 12px var(--font-mono);color:#0F172A}
  .m-val.flash{animation:flash .9s ease}
  @keyframes flash{0%{color:var(--brand-light);transform:translateY(-2px)}100%{color:#0F172A;transform:none}}
  .b-appr{
    margin-top:8px;padding:5px 8px;border-radius:8px;background:#FEF3C7;border:1px solid #FDE68A;
    color:#B45309;font:700 9.5px var(--font-sans);letter-spacing:.05em;text-align:center;
  }
  .b-what{margin-top:8px;font:500 10px/1.35 var(--font-sans);color:#94A3B8}

  /* ---------- chrome ---------- */
  #overviewBtn{
    position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));height:36px;padding:0 15px;border-radius:10px;cursor:pointer;
    border:1px solid var(--hairline);background:rgba(255,255,255,.95);color:#334155;
    font:700 10.5px var(--font-sans);letter-spacing:.1em;z-index:30;
  }
  #overviewBtn:hover{background:#fff;border-color:#CDE9E2;color:var(--brand-dark)}
  #zoomCtl{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:30}
  #zoomCtl button{
    width:40px;height:40px;border-radius:11px;cursor:pointer;border:1px solid var(--hairline);
    background:rgba(255,255,255,.95);color:#334155;font:700 15px/1 var(--font-sans);
  }
  #zoomCtl button:hover{background:#fff;border-color:#CDE9E2;color:var(--brand-dark)}

  #hint{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:29;padding:7px 14px;border-radius:20px;background:rgba(15,23,42,.82);color:#fff;
    font:600 11px var(--font-sans);letter-spacing:.04em;pointer-events:none;
    opacity:0;transition:opacity .5s ease;white-space:nowrap;max-width:calc(100vw - 28px);
    overflow:hidden;text-overflow:ellipsis;
  }
  #hint.on{opacity:1}
  #hint b{color:#8AD8C2}

  /* the pod strip: how a phone moves around the floor without hunting for a 118px card */
  #podbar{
    position:fixed;top:var(--topbar-h);left:0;right:0;z-index:28;display:none;gap:6px;
    overflow-x:auto;scrollbar-width:none;padding:8px 10px;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.74));
    border-bottom:1px solid var(--hairline);backdrop-filter:blur(8px);
  }
  #podbar::-webkit-scrollbar{display:none}
  #podbar button{
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;height:30px;padding:0 11px;border-radius:20px;
    border:1px solid var(--hairline);background:#fff;color:#334155;cursor:pointer;
    font:600 10.5px var(--font-sans);letter-spacing:.06em;
  }
  #podbar button.on{border-color:#BFE3DA;background:#e6f4f1;color:#1B6C5F}
  #podbar .pd{width:7px;height:7px;border-radius:50%}
  #podbar .pn{font:700 10px var(--font-mono);color:#94a3b8;background:#f1f5f9;border-radius:20px;padding:1px 6px}
  #podbar button.on .pn{background:#fff;color:#1B6C5F}
  @media (max-width: 900px){ #podbar{display:flex} }

  /* ======================= phone + small tablet ======================= */
  @media (max-width: 900px){
    :root{--topbar-h:46px}
    #topbar{gap:8px;padding:0 10px}
    .brand-logo{height:19px}
    .tdot{width:7px;height:7px}
    .svc{width:27px;height:27px;flex-basis:27px}
    .svc-icon{width:23px;height:23px}
    #topAppr{padding:0 9px}
    #topAppr .ap-long{display:none}
    #clock{display:none}
    .badge{width:154px;padding:9px 10px 8px;border-radius:11px}
    .b-num{font-size:17px}
    .b-count{margin:4px 0 6px}
    .b-metrics{gap:3px;padding-top:6px}
    .m-val{font-size:11px}
    .b-what{display:none}
    .pill{padding:3px 9px;font-size:9px}
    #overviewBtn{height:40px;padding:0 14px;font-size:10px}
  }

  /* very small phones: the pod cards shrink to a name + two numbers */
  @media (max-width: 480px){
    .badge{width:118px;padding:7px 9px}
    .b-name{font-size:9px;letter-spacing:.08em}
    .b-count{display:none}
    .b-metrics{padding-top:5px;gap:2px;border-top:0}
    .m-lab{font-size:7.5px;letter-spacing:.06em}
    .m-val{font-size:10.5px}
    .badge .b-appr{margin-top:5px;padding:3px 6px;font-size:8.5px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<svg id="svcLinks" aria-hidden="true"></svg>
<div id="hud"></div>
<div id="vignette"></div>

<div id="topbar">
  <div class="brand-wrap" onclick="location.reload()">
    <div class="terminal-dots">
      <span class="tdot red"></span><span class="tdot amber"></span><span class="tdot green"></span>
    </div>
    <span class="brand"><img src="3dots-logo-v1.webp" alt="3dots" class="brand-logo"></span>
  </div>
  <div id="topconn"></div>
  <span class="sp"></span>
  <span id="topAppr" style="display:none">⚠ <span class="ap-n">0</span><span class="ap-long"> WAITING FOR A PERSON</span></span>
  <span id="topFollow" style="display:none">⚡ <span class="fo-n">0</span><span class="fo-long"> FOLLOW-UPS</span></span>
  <span id="topBook" style="display:none">✓ <span class="bk-n">0</span><span class="bk-long"> BOOKED</span></span>
  <span id="clock">—</span>
</div>

<div id="hint"></div>
<div id="podbar"></div>
<button id="overviewBtn">◂ OVERVIEW</button>
<div id="zoomCtl">
  <button id="zIn" title="zoom in">+</button>
  <button id="zOut" title="zoom out">−</button>
  <button id="zHome" title="overview">⌂</button>
</div>

<!--APP-->
</body>
</html>
